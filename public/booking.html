<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a slot - NEW GEN EV</title>
<link rel="stylesheet" href="/style.css">
<style>
.bookform{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
@media(max-width:700px){.bookform{grid-template-columns:1fr 1fr}}
.badge{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge.booked{background:rgba(255,181,71,.15);color:var(--amber)}
.badge.active{background:rgba(51,217,178,.15);color:var(--teal)}
.badge.expired{background:rgba(255,97,97,.15);color:var(--red)}
.badge.cancelled{background:rgba(138,151,161,.15);color:var(--muted)}
.badge.completed{background:rgba(138,151,161,.15);color:var(--muted)}
.rowbtn{padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;font-size:12.5px;margin-right:6px}
.rowbtn.primary{background:var(--amber);color:#241300;border-color:var(--amber);font-weight:600}
.rowbtn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="bolt">⚡</div>NEW GEN EV</div>
    <div class="navlinks">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/history.html">History</a>
      <a href="/booking.html" class="active">Book a slot</a>
      <span id="userChip" style="color:var(--text)"></span>
    </div>
    <button class="logout" onclick="Auth.logout()">Log out</button>
  </div>

  <div class="section-title" style="margin-top:24px">Book a charging slot</div>
  <p class="hint">If you don't check in within <b id="graceMin">15</b> minutes of your slot's start time, it's automatically released for others.</p>

  <div class="card" style="margin-top:12px">
    <div class="bookform">
      <div><label for="date">Date</label><input type="date" id="date"></div>
      <div><label for="time">Start time</label><input type="time" id="time"></div>
      <div>
        <label for="duration">Duration</label>
        <select id="duration" style="width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text)">
          <option value="15">15 min</option>
          <option value="30" selected>30 min</option>
          <option value="45">45 min</option>
          <option value="60">60 min</option>
          <option value="90">90 min</option>
        </select>
      </div>
      <button class="btn" style="margin-top:0" onclick="book()">Book slot</button>
    </div>
    <div class="err" id="err" style="display:none;margin-top:14px"></div>
  </div>

  <div class="section-title">My bookings</div>
  <div class="card" style="padding:6px 16px">
    <table>
      <thead><tr><th>Slot</th><th>Station</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">No bookings yet.</div>
  </div>
</div>

<script src="/app.js"></script>
<script>
Auth.requireAuth();
paintUserChip();

let myStationId = null;

async function loadStation(){
  const data = await api('/auth/me');
  if(data.stations && data.stations[0]) myStationId = data.stations[0].id;
}

function fmtSlot(startIso, endIso){
  const s = new Date(startIso), e = new Date(endIso);
  return s.toLocaleDateString() + ' · ' + s.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) +
         ' – ' + e.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function minutesUntil(iso){
  return Math.round((new Date(iso).getTime() - Date.now())/60000);
}

async function loadBookings(){
  const data = await api('/bookings');
  document.getElementById('graceMin').textContent = data.checkinGraceMin;
  const rows = document.getElementById('rows');

  if(!data.bookings.length){
    document.getElementById('emptyMsg').style.display = 'block';
    rows.innerHTML = '';
    return;
  }
  document.getElementById('emptyMsg').style.display = 'none';

  rows.innerHTML = data.bookings.map(b => {
    let actions = '';
    if(b.status === 'booked'){
      const graceEnd = new Date(new Date(b.slot_start).getTime() + data.checkinGraceMin*60000);
      const withinWindow = Date.now() >= new Date(b.slot_start).getTime() && Date.now() <= graceEnd.getTime();
      if(withinWindow){
        actions += `<button class="rowbtn primary" onclick="checkin(${b.id})">Check in now</button>`;
      }
      actions += `<button class="rowbtn" onclick="cancelBooking(${b.id})">Cancel</button>`;
    }
    return `<tr>
      <td>${fmtSlot(b.slot_start, b.slot_end)}</td>
      <td>${b.station_name}</td>
      <td><span class="badge ${b.status}">${b.status}</span></td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
}

async function book(){
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  try{
    if(!myStationId) await loadStation();
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;
    const duration = document.getElementById('duration').value;
    if(!date || !time){ throw new Error('pick a date and time'); }

    const slotStart = new Date(`${date}T${time}:00`).toISOString();
    await api('/bookings', {
      method: 'POST',
      body: JSON.stringify({ stationId: myStationId, slotStart, durationMin: Number(duration) })
    });
    await loadBookings();
  }catch(e){
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function checkin(id){
  try{ await api(`/bookings/${id}/checkin`, {method:'POST'}); loadBookings(); }
  catch(e){ alert(e.message); }
}
async function cancelBooking(id){
  try{ await api(`/bookings/${id}/cancel`, {method:'POST'}); loadBookings(); }
  catch(e){ alert(e.message); }
}

(async ()=>{
  await loadStation();
  await loadBookings();
  setInterval(loadBookings, 15000);
})();
</script>
</body>
</html>
